<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PURA OS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <img src="https://i.pravatar.cc/100?img=15" alt="PURA OS avatar" />
        <div class="header-text">
          <b>PURA OS 🚀</b>
          <span><i class="dot"></i> online • har cheez ka expert</span>
        </div>
      </header>

      <main class="chat-area" id="chat"></main>

      <footer class="input-area">
        <input
          id="msgInput"
          type="text"
          placeholder="Message"
          autocomplete="off"
        />
        <button id="sendBtn" class="send-btn" aria-label="Send message">➤</button>
      </footer>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
